name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # The npm bundled with Node 22 is too old for OIDC trusted publishing.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          npm publish --provenance --access public --tag "$dist_tag"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          notes="$(mktemp)"
          python3 - "$version" "$notes" <<'PY'
          import pathlib, re, sys
          version, dest = sys.argv[1], sys.argv[2]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[?{re.escape(version)}\]?.*$"
          lines = text.splitlines()
          start = next((i for i, line in enumerate(lines) if re.match(pattern, line)), None)
          if start is None:
              pathlib.Path(dest).write_text(f"Release {version}\n", encoding="utf-8")
              raise SystemExit(0)
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          pathlib.Path(dest).write_text("\n".join(lines[start:end]).strip() + "\n", encoding="utf-8")
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes" "${prerelease[@]}"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes" --verify-tag "${prerelease[@]}"
          fi
